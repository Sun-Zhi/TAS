<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务执行监控大屏</title>
<script src="/js/theme.js?v=20260828-1"></script>
<link rel="stylesheet" href="/css/style.css?v=20260902-1">
<!-- 大屏局部样式已外置（CSP style-src 'self' 禁止 <style> 与 style 属性，安全评审 M4） -->
<link rel="stylesheet" href="/css/screen.css?v=20260902-1">
</head>
<body>
<div class="screen">
  <div class="hd" data-theme-mount>
    <h1>任务执行监控大屏</h1>
    <span class="tag"><span class="live"></span>实时数据</span>
    <span class="tag" id="scrError" hidden></span>
    <div class="sp"></div>
    <div class="clock"><b id="clkTime">--:--:--</b><span id="clkDate"></span></div>
    <a href="/index.html">返回工作台</a>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="main">
    <div class="card">
      <div class="card-hd"><span class="bar bar-warn"></span>执行中任务
        <span class="cnt" id="cntRun"></span></div>
      <div class="card-bd"><div class="scroller" id="listRun"></div></div>
    </div>

    <div class="card">
      <div class="card-hd"><span class="bar bar-success"></span>已完成任务（含执行耗时）
        <span class="cnt" id="cntDone"></span></div>
      <div class="card-bd"><div class="scroller" id="listDone"></div></div>
    </div>

    <div class="split col3">
      <div class="card">
        <div class="card-hd"><span class="bar"></span>所有角色任务分布</div>
        <div class="card-bd"><div class="scroller" id="listRank"></div></div>
      </div>
      <div class="card">
        <div class="card-hd"><span class="bar bar-success"></span>近 7 日任务趋势</div>
        <div class="card-bd card-bd-col">
          <div class="trend" id="trend"></div>
          <div class="legend"><span><s class="swatch-primary"></s>新建</span><span><s class="swatch-success"></s>完成</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-hd"><span class="bar bar-primary2"></span>任务类别分布</div>
        <div class="card-bd"><div class="scroller" id="listCat"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="/js/util.js?v=20260825-1"></script>
<script src="/js/screen.js?v=20260901-1"></script>
</body>
</html>
