<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台 · 任务分配系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="mark">✓</span>任务分配系统</div>
  <nav class="nav">
    <a href="#" data-view="tasks" class="active">任务中心</a>
    <a href="#" data-view="users" id="navUsers" style="display:none">用户管理</a>
    <a href="/screen.html" target="_blank">数据大屏 ↗</a>
  </nav>
  <div class="spacer"></div>
  <div class="userbox">
    <div class="avatar" id="uAvatar">-</div>
    <div class="meta">
      <div class="nm" id="uName">-</div>
      <div class="rl" id="uRole">-</div>
    </div>
    <button class="btn ghost sm" id="btnPwd">改密码</button>
    <button class="btn ghost sm" id="btnLogout">退出</button>
  </div>
</div>

<div class="container">

  <!-- ============ 任务中心 ============ -->
  <section id="view-tasks">
    <div class="page-head">
      <h2>任务中心</h2>
      <span class="desc" id="scopeDesc"></span>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnExport">导出任务清单</button>
      <button class="btn" id="btnNewTask" style="display:none">＋ 发布新任务</button>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="filters">
      <div class="seg" id="statusSeg">
        <button data-status="" class="on">全部</button>
        <button data-status="in_progress">执行中</button>
        <button data-status="completed">已完成</button>
      </div>
      <select class="input" id="fAssignee"><option value="">全部执行者</option></select>
      <select class="input" id="fCategory"><option value="">全部类别</option></select>
      <input class="input search" id="fSearch" placeholder="搜索任务标题 / 描述 / 执行人">
      <button class="btn ghost sm" id="btnReset">重置</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>任务列表</h3>
        <span class="desc" id="taskCount" style="color:var(--text-mute);font-size:13px"></span>
        <button class="btn danger sm" id="btnBatchDel" style="display:none;margin-left:auto">删除选中（<b id="selCount">0</b>）</button>
      </div>
      <div id="taskTableWrap"></div>
    </div>
  </section>

  <!-- ============ 用户管理 ============ -->
  <section id="view-users" style="display:none">
    <div class="page-head">
      <h2>用户管理</h2>
      <span class="desc">管理员可创建账号并分配角色</span>
      <div class="spacer"></div>
      <button class="btn" id="btnNewUser">＋ 新建用户</button>
    </div>
    <div class="panel">
      <div id="userTableWrap"></div>
    </div>
  </section>

</div>

<!-- ============ 任务表单弹窗 ============ -->
<div class="modal-mask" id="taskModal">
  <div class="modal wide">
    <div class="modal-head">
      <h3 id="taskModalTitle">发布新任务</h3>
      <button class="x" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <form id="taskForm">
        <input type="hidden" id="tfId">
        <div class="field">
          <label>任务标题 <span class="req">*</span></label>
          <input class="input" id="tfTitle" placeholder="简要描述任务目标" required>
        </div>
        <div class="field">
          <label>任务描述</label>
          <textarea class="input" id="tfDesc" placeholder="详细说明任务内容、验收标准等"></textarea>
        </div>
        <div class="grid2">
          <div class="field">
            <label>执行人 <span class="req">*</span></label>
            <select class="input" id="tfAssignee" required></select>
            <div class="hint">保存后任务自动派发给该执行者</div>
          </div>
          <div class="field">
            <label>任务类别</label>
            <input class="input" id="tfCategory" list="catList" placeholder="如：需求开发 / 线上问题">
            <datalist id="catList"></datalist>
          </div>
          <div class="field">
            <label>优先级</label>
            <select class="input" id="tfPriority">
              <option value="low">低</option>
              <option value="normal" selected>普通</option>
              <option value="high">高</option>
              <option value="urgent">紧急</option>
            </select>
          </div>
          <div class="field">
            <label>要求完成时间</label>
            <div class="datetime-picker-wrap" id="tfDueWrap">
              <input class="input datetime-input" id="tfDueDisplay" readonly placeholder="点击选择截止时间"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="tfDuePicker">
              <input type="hidden" id="tfDue">
              <div class="datetime-picker" id="tfDuePicker" role="dialog" aria-label="选择要求完成时间">
                <div class="dp-header">
                  <button type="button" class="dp-nav" data-dp="prev" aria-label="上个月">‹</button>
                  <span class="dp-title" id="dpTitle">2026年08月</span>
                  <button type="button" class="dp-nav" data-dp="next" aria-label="下个月">›</button>
                </div>
                <div class="dp-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
                <div class="dp-days" id="dpDays"></div>
                <div class="dp-time">
                  <span>时间</span>
                  <select id="dpHour" aria-label="小时"></select>
                  <b>:</b>
                  <select id="dpMinute" aria-label="分钟"></select>
                </div>
                <div class="dp-footer">
                  <button type="button" class="dp-btn text" data-dp="today">今天</button>
                  <button type="button" class="dp-btn text" data-dp="clear">清除</button>
                  <button type="button" class="dp-btn primary" data-dp="ok">确定</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="field" id="tfFileField">
          <label>附件</label>
          <div class="dropzone" id="dropzone">
            点击选择文件，或将文件拖拽到此处<br>
            <span class="hint">单个不超过 50MB，最多 10 个</span>
          </div>
          <input type="file" id="tfFiles" multiple hidden>
          <div class="file-list" id="fileList"></div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="btnSaveTask">保存并派发</button>
    </div>
  </div>
</div>

<!-- ============ 任务详情弹窗 ============ -->
<div class="modal-mask" id="detailModal">
  <div class="modal wide">
    <div class="modal-head">
      <h3 id="dtTitle">任务详情</h3>
      <button class="x" data-close>&times;</button>
    </div>
    <div class="modal-body" id="dtBody"></div>
    <div class="modal-foot" id="dtFoot"></div>
  </div>
</div>

<!-- ============ 用户表单弹窗 ============ -->
<div class="modal-mask" id="userModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="userModalTitle">新建用户</h3>
      <button class="x" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <form id="userForm">
        <input type="hidden" id="ufId">
        <div class="grid2">
          <div class="field">
            <label>登录账号 <span class="req">*</span></label>
            <input class="input" id="ufUsername" placeholder="英文/数字" required>
          </div>
          <div class="field">
            <label>姓名 <span class="req">*</span></label>
            <input class="input" id="ufName" required>
          </div>
          <div class="field">
            <label>角色 <span class="req">*</span></label>
            <select class="input" id="ufRole">
              <option value="executor">任务执行者</option>
              <option value="assigner">任务分配者</option>
              <option value="admin">管理员</option>
            </select>
          </div>
          <div class="field">
            <label>部门</label>
            <input class="input" id="ufDept" placeholder="选填">
          </div>
        </div>
        <div class="field">
          <label>密码 <span class="req" id="ufPwdReq">*</span></label>
          <input class="input" id="ufPassword" type="text" placeholder="至少 6 位">
          <div class="hint" id="ufPwdHint">编辑时留空表示不修改密码</div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="btnSaveUser">保存</button>
    </div>
  </div>
</div>

<!-- ============ 完成任务弹窗 ============ -->
<div class="modal-mask" id="doneModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-head"><h3>标记任务执行完成</h3><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <div id="doneTaskInfo" style="margin-bottom:14px;padding:12px 14px;background:#f7f9fc;border-radius:8px"></div>
      <div class="field">
        <label>完成说明</label>
        <textarea class="input" id="doneNote" placeholder="简要说明完成情况、结果或交付物（可留空）"></textarea>
      </div>
      <div class="hint">提交后系统将自动记录完成时间并计算本次任务的执行耗时。</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn success" id="btnConfirmDone">确认完成</button>
    </div>
  </div>
</div>

<!-- ============ 改密码弹窗 ============ -->
<div class="modal-mask" id="pwdModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-head"><h3>修改密码</h3><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>原密码</label><input class="input" id="pwOld" type="password"></div>
      <div class="field"><label>新密码</label><input class="input" id="pwNew" type="password" placeholder="至少 6 位"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="btnSavePwd">确认修改</button>
    </div>
  </div>
</div>

<!-- ============ 导出弹窗 ============ -->
<div class="modal-mask" id="exportModal">
  <div class="modal" style="max-width:460px">
    <div class="modal-head"><h3>导出任务清单</h3><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <div class="field">
        <label>按执行者导出</label>
        <select class="input" id="exAssignee"><option value="">全部执行者</option></select>
        <div class="hint">导出该执行者名下所有任务，含任务类别、状态与耗时</div>
      </div>
      <div class="field">
        <label>任务状态</label>
        <select class="input" id="exStatus">
          <option value="">全部状态</option>
          <option value="in_progress">仅执行中</option>
          <option value="completed">仅已完成</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="btnDoExport">导出 CSV</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/app.js"></script>
</body>
</html>
