<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 任务分配系统</title>
<script src="/js/theme.js?v=20260828-1"></script>
<link rel="stylesheet" href="/css/style.css?v=20260828-1">
</head>
<body>
<div class="login-wrap">
  <div class="login-hero">
    <h1>任务分配协同系统</h1>
    <p>创建任务 · 自动派发 · 执行跟踪 · 耗时统计 · 数据大屏</p>
    <div class="hero-points">
      <div class="hero-point"><span class="dot">1</span><div><b>分配者</b>发布任务并指定执行人，支持附件</div></div>
      <div class="hero-point"><span class="dot">2</span><div><b>执行者</b>收到任务后执行，完成即标记</div></div>
      <div class="hero-point"><span class="dot">3</span><div><b>管理员</b>管理账号、总览全部任务</div></div>
      <div class="hero-point"><span class="dot">4</span><div><b>数据大屏</b>实时展示执行中 / 已完成与耗时</div></div>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-card">
      <h2>欢迎回来</h2>
      <p class="sub">请使用系统分配的账号登录</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">账号</label>
          <input class="input" id="username" autocomplete="username" placeholder="请输入账号" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input class="input" id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <button class="btn block" type="submit" id="submitBtn">登 录</button>
      </form>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/js/login.js?v=20260813-1"></script>
</body>
</html>
